<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Berlin Journal — Admin</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // Inject a fixed back-to-site link after the CMS has rendered
      window.addEventListener('load', function () {
        setTimeout(function () {
          var a = document.createElement('a');
          a.href = '/';
          a.textContent = '← site';
          a.style.cssText = [
            'position:fixed',
            'bottom:20px',
            'left:20px',
            'z-index:99999',
            'background:#1a1a1a',
            'color:#fff',
            'padding:6px 14px',
            'font-size:12px',
            'font-family:monospace',
            'text-decoration:none',
            'border-radius:4px',
            'opacity:0.65',
            'transition:opacity 0.15s',
          ].join(';');
          a.addEventListener('mouseenter', function () { this.style.opacity = '1'; });
          a.addEventListener('mouseleave', function () { this.style.opacity = '0.65'; });
          document.body.appendChild(a);
        }, 1500);
      });
    </script>
  </body>
</html>
